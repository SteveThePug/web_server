type User {
  id: ID!
  createdAt: Time!
  updatedAt: Time!
  username: String!
  admin: Boolean!
}

input CreateUserInput {
  username: String!
  password: String!
}

extend type Query {
  users: [User!]! @admin
  user(id: ID!): User @admin
}

extend type Mutation {
  createUser(input: CreateUserInput!): User! @admin
  deleteUser(id: ID!): User! @admin
  setUserAdmin(id: ID!, admin: Boolean!): User! @admin
}
