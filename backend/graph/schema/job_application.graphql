# Job application tracker. Rows come from these mutations, automatically from
# the email sync pipeline (backend/services/email_sync.go), or from the browser
# capture userscript (backend/handlers/handle_job_capture.go). These are
# private data, so the queries here are @admin as well as the mutations.
#
# description is the captured posting text. It can run to tens of kilobytes,
# so the tracker's list query leaves it out and asks for it per row.

# The lifecycle of an application, in the order the email pipeline and the
# capture endpoint are allowed to advance it. The values are lowercase on
# purpose: they are exactly the strings stored in the status column and ranked
# in services.statusOrder (backend/services/email_sync.go), and a test there
# fails if this list and that map ever differ. Adding a status means adding
# it in both places, and to the tracker page and the capture userscript.
#
# It is bound to a custom marshaller (services/job_status.go, via gqlgen.yml)
# rather than a generated Go type: input is strict, so a mutation carrying a
# status outside this list is refused, while output passes a legacy stored
# value through so one old row cannot fail the whole jobApplications query.
#
# On the wire it is still a JSON string ("applied"), as it was when the field
# was a String, both in variables and in responses.
enum JobStatus {
  saved
  applied
  screening
  assessment
  interviewing
  offer
  rejected
  withdrawn
}

type JobApplication {
  id: ID!
  createdAt: Time!
  updatedAt: Time!
  jobTitle: String!
  company: String!
  location: String
  url: String
  status: JobStatus!
  notes: String
  appliedAt: Time
  description: String
}

input CreateJobApplicationInput {
  jobTitle: String!
  company: String!
  location: String
  url: String
  status: JobStatus!
  notes: String
  appliedAt: Time
  description: String
}

input UpdateJobApplicationInput {
  jobTitle: String
  company: String
  location: String
  url: String
  status: JobStatus
  notes: String
  appliedAt: Time
  description: String
}

extend type Query {
  jobApplications: [JobApplication!]! @admin
  jobApplication(id: ID!): JobApplication @admin
}

extend type Mutation {
  createJobApplication(input: CreateJobApplicationInput!): JobApplication! @admin
  updateJobApplication(id: ID!, input: UpdateJobApplicationInput!): JobApplication! @admin
  # Errors on an id that does not exist, like the other deletes; the Boolean
  # is only ever true.
  deleteJobApplication(id: ID!): Boolean! @admin
}
