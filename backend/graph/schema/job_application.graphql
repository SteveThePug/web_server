# Job application tracker. Rows come from these mutations, automatically from
# the email sync pipeline (backend/services/email_sync.go), or from the browser
# capture userscript (backend/handlers/handle_job_capture.go). These are
# private data, so the queries here are admin-only as well as the mutations.
#
# status is a free-form String, but only the values ranked in
# services.statusOrder can be advanced automatically by the email pipeline:
# saved, applied, screening, assessment, interviewing, offer, rejected,
# withdrawn.
#
# description is the captured posting text. It can run to tens of kilobytes,
# so the tracker's list query leaves it out and asks for it per row.

type JobApplication {
  id: ID!
  createdAt: Time!
  updatedAt: Time!
  jobTitle: String!
  company: String!
  location: String
  url: String
  status: String!
  notes: String
  appliedAt: Time
  description: String
}

input CreateJobApplicationInput {
  jobTitle: String!
  company: String!
  location: String
  url: String
  status: String!
  notes: String
  appliedAt: Time
  description: String
}

input UpdateJobApplicationInput {
  jobTitle: String
  company: String
  location: String
  url: String
  status: String
  notes: String
  appliedAt: Time
  description: String
}

extend type Query {
  jobApplications: [JobApplication!]!
  jobApplication(id: ID!): JobApplication
}

extend type Mutation {
  createJobApplication(input: CreateJobApplicationInput!): JobApplication!
  updateJobApplication(id: ID!, input: UpdateJobApplicationInput!): JobApplication!
  deleteJobApplication(id: ID!): Boolean!
}
