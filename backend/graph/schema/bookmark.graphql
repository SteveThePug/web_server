type Bookmark {
  id: ID!
  createdAt: Time!
  updatedAt: Time!
  category: String!
  name: String!
  link: String!
}

input CreateBookmarkInput {
  category: String!
  name: String!
  link: String!
}

extend type Query {
  bookmarks: [Bookmark!]!
}

extend type Mutation {
  createBookmark(input: CreateBookmarkInput!): Bookmark!
  deleteBookmark(id: ID!): Bookmark!
}
