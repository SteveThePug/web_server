type Favorite {
  id: ID!
  createdAt: Time!
  updatedAt: Time!
  type: String!
  name: String!
  link: String
}

input CreateFavoriteInput {
  type: String!
  name: String!
  link: String
}

extend type Query {
  favorites: [Favorite!]!
}

extend type Mutation {
  createFavorite(input: CreateFavoriteInput!): Favorite!
}
