# Reusable snippets for filling in application forms. Private, like the
# applications themselves, so the query is @admin as well as the mutations.

type JobAppReference {
  id: ID!
  createdAt: Time!
  updatedAt: Time!
  category: String!
  label: String!
  value: String!
  sortOrder: Int!
}

input CreateJobAppReferenceInput {
  category: String!
  label: String!
  value: String!
  sortOrder: Int
}

input UpdateJobAppReferenceInput {
  category: String
  label: String
  value: String
  sortOrder: Int
}

extend type Query {
  jobAppReferences: [JobAppReference!]! @admin
}

extend type Mutation {
  createJobAppReference(input: CreateJobAppReferenceInput!): JobAppReference! @admin
  updateJobAppReference(id: ID!, input: UpdateJobAppReferenceInput!): JobAppReference! @admin
  # Errors on an id that does not exist, like the other deletes; the Boolean
  # is only ever true.
  deleteJobAppReference(id: ID!): Boolean! @admin
}
