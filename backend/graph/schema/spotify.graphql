type SpotifyArtist {
  name: String!
}

type SpotifyImage {
  url: String!
}

type SpotifyAlbum {
  name: String!
  images: [SpotifyImage!]!
}

type SpotifyTrack {
  name: String!
  artists: [SpotifyArtist!]!
  album: SpotifyAlbum!
}

type SpotifyPlaying {
  playing: Boolean!
  track: SpotifyTrack
}

type SpotifyRecentItem {
  track: SpotifyTrack!
  playedAt: Time!
}

extend type Query {
  spotifyListening: SpotifyPlaying
  spotifyRecent: [SpotifyRecentItem!]
}
