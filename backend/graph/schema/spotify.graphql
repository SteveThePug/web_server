# Spotify "now playing" / "recently played" for the home page. Both resolve to
# null / an empty list when the backend has never completed the Spotify OAuth
# flow, so the page degrades rather than erroring.

type SpotifyArtist {
  name: String!
}

type SpotifyImage {
  url: String!
}

type SpotifyAlbum {
  name: String!
  images: [SpotifyImage!]!
}

type SpotifyTrack {
  name: String!
  artists: [SpotifyArtist!]!
  album: SpotifyAlbum!
}

type SpotifyPlaying {
  playing: Boolean!
  track: SpotifyTrack
}

type SpotifyRecentItem {
  track: SpotifyTrack!
  playedAt: Time!
}

extend type Query {
  spotifyListening: SpotifyPlaying
  spotifyRecent: [SpotifyRecentItem!]
  # True only for an admin session while the backend lacks a Spotify client
  # (OAuth never completed or the token was revoked), used by the Listening
  # widget to offer a reconnect link. Everyone else gets false.
  spotifyNeedsReauth: Boolean!
}
