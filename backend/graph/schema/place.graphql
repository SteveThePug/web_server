# Places to go. Unlike most mutations these require only a signed-in user
# (@signedIn), not an admin, and there is no per-user ownership: the list is
# shared. The query is guarded too — the list is not public.

type Place {
  id: ID!
  createdAt: Time!
  updatedAt: Time!
  title: String!
  location: String
  notes: String
  imageUrl: String
  category: String
  cost: String
  priority: Int!
  done: Boolean!
}

input CreatePlaceInput {
  title: String!
  location: String
  notes: String
  imageUrl: String
  category: String
  cost: String
  priority: Int
  done: Boolean
}

input UpdatePlaceInput {
  title: String
  location: String
  notes: String
  imageUrl: String
  category: String
  cost: String
  priority: Int
  done: Boolean
}

extend type Query {
  places: [Place!]! @signedIn
}

extend type Mutation {
  createPlace(input: CreatePlaceInput!): Place! @signedIn
  updatePlace(id: ID!, input: UpdatePlaceInput!): Place! @signedIn
  deletePlace(id: ID!): Place! @signedIn
}
