# Latest activity from the self-hosted Gitea instance, proxied and cached for
# one minute by the backend. Resolves to null when the feed is empty.

type GiteaFeedItem {
  avatarUrl: String!
  repoUrl: String!
  repoName: String!
  opType: String!
  commitMessage: String!
  createdAt: Time!
}

extend type Query {
  giteaFeed: GiteaFeedItem
}
