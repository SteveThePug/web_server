type Post {
  id: ID!
  createdAt: Time!
  updatedAt: Time!
  title: String!
  author: User
  content: String!
}

input CreatePostInput {
  title: String!
  content: String!
}

input UpdatePostInput {
  title: String!
  content: String!
}

extend type Query {
  posts: [Post!]!
  post(id: ID!): Post
}

extend type Mutation {
  createPost(input: CreatePostInput!): Post!
  updatePost(id: ID!, input: UpdatePostInput!): Post!
  deletePost(id: ID!): Post!
}
