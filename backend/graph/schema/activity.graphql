type Activity {
  id: ID!
  createdAt: Time!
  updatedAt: Time!
  type: String!
  name: String!
  link: String
}

input CreateActivityInput {
  type: String!
  name: String!
  link: String
}

extend type Query {
  activities: [Activity!]!
}

extend type Mutation {
  createActivity(input: CreateActivityInput!): Activity!
}
