# Steam presence and recent games for the home page, cached for five minutes.
# headerImage is built from the app id rather than returned by Steam's API.

type SteamGame {
  appId: Int!
  name: String!
  playtime2Weeks: Int!
  playtimeForever: Int!
  headerImageUrl: String!
}

type SteamStatus {
  online: Boolean!
  recentGames: [SteamGame!]!
}

extend type Query {
  steamStatus: SteamStatus
}
