# STATUS: deprecated. The /hasura/ blocks removed from nginx.conf.template and
# nginx_dev_common.conf.template (identical in both). See ../README.md.
        set $upstream_hasura http://$HASURA_HOST:$HASURA_PORT;

        location /hasura {
            return 301 /hasura/;
        }

        location /hasura/ {
            auth_request /internal/auth/admin-validate;
            error_page 401 403 = @auth_denied;
            rewrite ^/hasura/(.*)$ /$1 break;
            proxy_pass $upstream_hasura;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
